<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout | Lagom Store</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body data-page="checkout">
  <div id="topbar"></div>
  <main>
    <div class="steps"><span class="active">1. Your details</span><span>2. Review</span><span>3. Done</span></div>
    <div class="layout-2">
      <form class="panel" id="checkout-form" novalidate>
        <h2 style="margin-bottom:18px">Delivery details</h2>
        <div class="alert alert-error" role="alert" data-test="error" hidden><span data-test="error-text"></span></div>
        <div class="form-row">
          <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" data-test="first-name" /></div>
          <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" data-test="last-name" /></div>
        </div>
        <div class="field"><label for="postalCode">Postal code</label><input id="postalCode" name="postalCode" inputmode="numeric" placeholder="114 55" autocomplete="postal-code" data-test="postal-code" /></div>
        <div class="summary-actions" style="grid-template-columns:1fr 1fr">
          <a class="btn btn-secondary" href="cart.html" data-test="cancel">Back to cart</a>
          <button class="btn btn-primary" type="submit" data-test="continue">Continue</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
